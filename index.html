<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ファクトリ囲碁 — FACTORY-GO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --brass:#d4a847; --brass-hi:#f6dc8a; --brass-lo:#7b5a1c;
  --paper:#ecdcb6; --ember:#ff7a1f; --teal:#3fe0d4;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:radial-gradient(ellipse at 30% 15%,#3d2a1a 0%,#1b120b 55%,#080504 100%) fixed;
  color:var(--paper);
  font-family:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
  overflow-x:hidden;
}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;gap:22px;padding:12px;flex-wrap:wrap}
#boardWrap{position:sticky;top:12px;align-self:flex-start;line-height:0;filter:drop-shadow(0 18px 30px rgba(0,0,0,.75))}
#board{display:block;border-radius:14px;touch-action:manipulation;cursor:pointer}
#start{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);opacity:0;pointer-events:none;
  line-height:1.4;text-align:center;padding:22px 30px 22px;min-width:280px;z-index:2;
  background:linear-gradient(160deg,#4a3320,#1e140c);border:3px solid var(--brass);border-radius:14px;
  box-shadow:0 0 0 2px #000,inset 0 0 0 2px rgba(246,220,138,.25),0 20px 50px rgba(0,0,0,.8),0 0 60px rgba(255,150,40,.35);
  transition:opacity .4s,transform .4s cubic-bezier(.2,1.4,.4,1);
}
#start.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
#start h2{margin:0 0 6px;font-family:'Cinzel Decorative','Shippori Mincho',serif;font-size:26px;color:var(--brass-hi);text-shadow:0 2px 0 #4d3510,0 0 16px rgba(255,170,60,.6)}
#start p{margin:0 0 14px;font-size:15px}
#start .note{font-size:12.5px;color:#cdb98a}
#start .pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#start .pick .btn{padding:12px 10px;font-size:18px;line-height:1.3}
#start .pick small{display:block;font-size:11px;font-weight:500;margin-top:2px}
#banner{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);opacity:0;pointer-events:none;
  line-height:1.4;text-align:center;padding:22px 34px 20px;min-width:260px;
  background:linear-gradient(160deg,#4a3320,#1e140c);border:3px solid var(--brass);border-radius:14px;
  box-shadow:0 0 0 2px #000,inset 0 0 0 2px rgba(246,220,138,.25),0 20px 50px rgba(0,0,0,.8),0 0 60px rgba(255,150,40,.35);
  transition:opacity .5s,transform .5s cubic-bezier(.2,1.4,.4,1);
}
#banner.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
#banner h2{margin:0 0 6px;font-family:'Cinzel Decorative','Shippori Mincho',serif;font-size:26px;color:var(--brass-hi);text-shadow:0 2px 0 #4d3510,0 0 16px rgba(255,170,60,.6)}
#banner p{margin:0 0 10px;font-size:16px}
#bnScore{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin:6px 0 10px}
#bnScore .side{display:flex;flex-direction:column;align-items:center;min-width:84px;padding:8px 10px;border:1px solid rgba(246,220,138,.25);border-radius:10px;background:rgba(0,0,0,.3);opacity:.7}
#bnScore .side small{font-size:12px;color:#cdb98a}
#bnScore .side b{font-family:'Cinzel Decorative',serif;font-size:32px;line-height:1.1;color:var(--paper)}
#bnScore .side.win b{font-size:60px}
#bnScore .side.win small{font-size:14px}
#bnScore .side.win{padding:10px 16px}
#bnScore .side em{font-style:normal;font-size:12px;color:#cdb98a}
#bnScore .side.win{opacity:1;border-color:var(--brass-hi);box-shadow:0 0 22px rgba(255,190,80,.5)}
#bnScore .side.win b{color:var(--brass-hi);text-shadow:0 0 14px rgba(255,170,60,.7)}
#bnScore .vsx{font-size:13px;color:#b99a58;padding-bottom:18px}
#banner .bnbtns{display:flex;justify-content:center;gap:10px}
#banner{transition:opacity .5s,transform .5s cubic-bezier(.2,1.4,.4,1),top .45s ease,width .45s ease,padding .45s ease}
/* "盤面を見る": the result shrinks into the strip at the top of the board (where the A-J labels are) */
#banner.mini{
  top:var(--bandY);left:50%;transform:translate(-50%,-50%) scale(1);
  width:calc(var(--boardW) - 2 * var(--padX));min-width:0;height:var(--bandH);padding:0 10px;
  display:flex;align-items:center;justify-content:center;gap:calc(var(--bandH) * .35);white-space:nowrap;overflow:hidden;
  border-width:1px;border-radius:8px;font-size:calc(var(--bandH) * .5);
  background:linear-gradient(180deg,#4a3320,#1e140c);box-shadow:0 0 0 1px #000,0 4px 14px rgba(0,0,0,.6);
}
#banner.mini h2{margin:0;font-size:calc(var(--bandH) * .44);text-shadow:0 1px 0 #4d3510}
#banner.mini p{margin:0;font-size:calc(var(--bandH) * .36);color:#cdb98a}
#banner.mini #bnScore{margin:0;gap:calc(var(--bandH) * .2);align-items:center}
#banner.mini #bnScore .side{flex-direction:row;align-items:baseline;gap:4px;min-width:0;padding:0 4px;border:none;background:none;box-shadow:none;opacity:.75}
#banner.mini #bnScore .side.win{opacity:1;padding:0 4px}
#banner.mini #bnScore .side small,#banner.mini #bnScore .side.win small{font-size:calc(var(--bandH) * .32)}
#banner.mini #bnScore .side b,#banner.mini #bnScore .side.win b{font-size:calc(var(--bandH) * .46)}
#banner.mini #bnScore .side em,#banner.mini #bnScore .vsx{display:none}
#banner.mini .bnbtns{gap:5px}
#banner.mini .btn{padding:0 9px;height:calc(var(--bandH) * .72);font-size:calc(var(--bandH) * .34);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 2px 0 #5a3f10}
@media (max-width:920px){#banner.mini p,#banner.mini #bnScore .side small{display:none}}

#panel{width:340px;max-width:100%;display:flex;flex-direction:column;gap:10px}
.plate{
  position:relative;background:linear-gradient(160deg,#3d2c1c,#21170f);
  border:2px solid var(--brass-lo);border-radius:10px;padding:10px 12px;
  box-shadow:inset 0 0 0 1px rgba(246,220,138,.16),inset 0 2px 10px rgba(0,0,0,.6),0 4px 10px rgba(0,0,0,.5);
}
.plate::before,.plate::after{
  content:"";position:absolute;top:5px;left:5px;width:7px;height:7px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff1b8,#b88a2c 55%,#4d3510);box-shadow:0 0 0 1px rgba(0,0,0,.55);
}
.plate::after{left:auto;right:5px}
h1{
  margin:0;text-align:center;font-family:'Cinzel Decorative','Shippori Mincho',serif;font-size:27px;letter-spacing:.05em;
  color:var(--brass-hi);text-shadow:0 2px 0 #4d3510,0 0 16px rgba(255,160,50,.5);
}
.sub{text-align:center;font-size:11px;letter-spacing:.35em;color:#b99a58;margin-top:2px}
.factions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fac{padding:8px 8px 6px;text-align:center;transition:box-shadow .3s,border-color .3s,filter .3s;filter:saturate(.7) brightness(.8)}
.fac.active{border-color:var(--brass-hi);filter:none;box-shadow:inset 0 0 0 1px rgba(246,220,138,.3),0 0 22px rgba(255,170,60,.45),0 4px 10px rgba(0,0,0,.5)}
.fac.f2.active{box-shadow:inset 0 0 0 1px rgba(246,220,138,.3),0 0 22px rgba(63,224,212,.45),0 4px 10px rgba(0,0,0,.5)}
.fac canvas{width:64px;height:64px;display:block;margin:0 auto}
.fac .nm{font-weight:700;font-size:14px;margin-top:2px}
.fac .en{font-size:9px;letter-spacing:.22em;color:#b99a58}
.fac .gauge{width:100%;height:auto;display:block;margin-top:2px}
.fac .num{font-family:'Cinzel Decorative',serif;font-size:20px;line-height:1;color:var(--brass-hi);margin-top:-6px}
.fac .lbl{font-size:10px;color:#b99a58;margin-top:2px}
.fac .own{font-size:11px;color:#cdb98a;margin-top:3px}
.status{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:#cdb98a}
.status b{font-family:'Cinzel Decorative',serif;font-size:15px;color:var(--brass-hi)}
.hint{min-height:64px;font-size:13.5px;line-height:1.6;padding-top:4px}
.hint .bad{color:#ff8b6b}.hint .good{color:#ffd98a}.hint .teal{color:#7fe3dc}
.btns{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.btns.two{grid-template-columns:repeat(2,1fr)}
.btn{
  cursor:pointer;border:1px solid #4d3510;border-radius:8px;padding:9px 8px;font:inherit;font-weight:700;font-size:14px;color:#2a1a08;
  background:linear-gradient(#f6dc8a,#cfa543 55%,#9a7625);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 3px 0 #5a3f10,0 5px 8px rgba(0,0,0,.5);
  transition:transform .08s,box-shadow .08s,filter .2s;
}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 1px 0 #5a3f10}
.btn:disabled{filter:grayscale(.8) brightness(.55);cursor:not-allowed;transform:none}
.btn.danger{background:linear-gradient(#e8a384,#b4552f 55%,#7d3417);color:#fff4e8}
.opts{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:13px}
.opts select{
  font:inherit;color:var(--paper);background:#150e08;border:1px solid var(--brass-lo);border-radius:6px;padding:5px 6px;
}
.opts label.chk{grid-column:1/3;display:flex;gap:8px;align-items:center;cursor:pointer}
#log{max-height:120px;overflow:auto;font-size:12.5px;line-height:1.55;color:#cdb98a}
#log div{border-bottom:1px dotted rgba(185,154,88,.2);padding:1px 0}
#log div.hot{color:#ffb070}
details.rules{font-size:12.5px;line-height:1.65;color:#d8c8a0}
details.rules summary{cursor:pointer;font-weight:700;color:var(--brass-hi)}
details.rules ul{margin:6px 0 0;padding-left:18px}
details.rules li{margin:3px 0}
.hidden{display:none!important}
/* ?demo=... clips: only the board, nothing else */
body.demo{overflow:hidden;background:#120c07}
body.demo #bg,body.demo #topbar,body.demo #panel,body.demo #start,body.demo #rulesModal{display:none!important}
body.demo #app{display:block;padding:0;min-height:0}
body.demo #boardWrap{position:absolute;filter:none;align-self:auto}
body.demo #banner .bnbtns{display:none}
/* rules: a modal slideshow, one rule line per page */
.rm{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(8,5,3,.84);opacity:0;pointer-events:none;transition:opacity .25s}
.rm.open{opacity:1;pointer-events:auto}
.rm-card{
  position:relative;width:min(100%,600px);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:14px 16px 16px;
  background:linear-gradient(160deg,#4a3320,#1e140c);border:3px solid var(--brass);border-radius:14px;
  box-shadow:0 0 0 2px #000,inset 0 0 0 2px rgba(246,220,138,.25),0 20px 50px rgba(0,0,0,.8);
  transform:translateY(12px) scale(.97);transition:transform .25s;
}
.rm.open .rm-card{transform:none}
.rm-head{display:flex;align-items:baseline;justify-content:space-between;padding-right:34px}
.rm-title{font-family:'Cinzel Decorative','Shippori Mincho',serif;font-size:20px;color:var(--brass-hi);text-shadow:0 2px 0 #4d3510}
.rm-count{font-size:14px;color:#cdb98a}
.rm-close{position:absolute;top:8px;right:10px;width:30px;height:30px;border-radius:50%;border:1px solid var(--brass-lo);background:#2a1a0c;color:var(--brass-hi);font-size:20px;line-height:1;cursor:pointer}
.rm-stage{background:#120c07;border:1px solid rgba(246,220,138,.25);border-radius:8px;display:flex;align-items:center;justify-content:center;min-height:180px;overflow:hidden;touch-action:pan-y;user-select:none}
.rm-stage img{display:block;width:100%;height:auto;max-height:min(50vh,520px);object-fit:contain}
.rm-stage{position:relative}
.rm-stage iframe{display:block;width:100%;height:auto;max-height:min(50vh,520px);border:0;background:#120c07}
.rm-stage iframe.slide-next{animation:rmNext .28s ease}
.rm-stage iframe.slide-prev{animation:rmPrev .28s ease}
.rm-shield{position:absolute;inset:0}                       /* sits over a clip so swipes still reach the stage */
.rm-stage img.slide-next{animation:rmNext .28s ease}
.rm-stage img.slide-prev{animation:rmPrev .28s ease}
@keyframes rmNext{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes rmPrev{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.rm-parent{min-height:1.2em;font-size:12.5px;line-height:1.5;color:#b99a58}
.rm-parent:empty{display:none}
.rm-text{font-size:17px;font-weight:700;line-height:1.6;color:var(--paper);min-height:3.2em;white-space:pre-line}
.rm-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rm-nav .btn{min-width:92px;padding:10px 10px;font-size:14px}
.rm-dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;flex:1}
.rm-dots i{width:9px;height:9px;border-radius:50%;background:#5a4426;cursor:pointer}
.rm-dots i.on{background:var(--brass-hi);box-shadow:0 0 6px rgba(246,220,138,.7)}
#topbar{display:none}
@media (max-width:920px){
  #app{flex-direction:column;flex-wrap:nowrap;justify-content:flex-start;gap:10px;padding:8px 8px 20px}
  #boardWrap{position:relative;top:auto;align-self:center}
  /* a slim bar above the board: title + a one-glance turn indicator */
  #topbar{
    display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:100%;padding:7px 12px;
    background:linear-gradient(160deg,#3d2c1c,#21170f);border:2px solid var(--brass-lo);border-radius:10px;
    box-shadow:inset 0 0 0 1px rgba(246,220,138,.16),0 4px 10px rgba(0,0,0,.5);
  }
  #topbar .tbTitle{font-family:'Cinzel Decorative','Shippori Mincho',serif;font-size:17px;letter-spacing:.04em;color:var(--brass-hi);text-shadow:0 2px 0 #4d3510,0 0 12px rgba(255,160,50,.4);white-space:nowrap}
  #topbar .tbTurn{display:flex;align-items:center;gap:7px;font-size:13.5px;white-space:nowrap}
  #topbar .tbMoves{font-size:12px;color:#cdb98a;white-space:nowrap}
  #topbar .tbMoves b{font-family:'Cinzel Decorative',serif;font-size:14px;color:var(--brass-hi)}
  #tbDot{width:13px;height:13px;border-radius:50%;border:2px solid #b8733a;background:#2c3037;box-shadow:0 0 8px rgba(255,122,31,.7)}
  #tbDot.t2{border-color:#2a9d97;background:#e8c871;box-shadow:0 0 8px rgba(63,224,212,.7)}
  #tbDot.idle{box-shadow:none;opacity:.5}
  /* the lower area: controls first, then the hint; title and the big faction cards are replaced by the top bar */
  #panel{width:100%;max-width:560px;gap:8px}
  #panel .p-title,#panel .factions{display:none}
  #panel .p-ctrl{order:1}#panel .p-status{order:2}#panel .p-log{order:3}#panel .p-rules{order:4}
  .p-ctrl{padding:10px 12px}
  .p-status .status{display:none}
  .p-status .hint{min-height:0;font-size:13px;padding-top:0}
  .btn{padding:11px 8px;font-size:15px}
  .opts select{padding:8px 6px;font-size:14px}
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="app">
  <div id="topbar">
    <span class="tbTitle">ファクトリ囲碁</span>
    <span class="tbTurn"><i id="tbDot"></i><b id="tbTurnTxt">黒の手番</b></span>
    <span class="tbMoves">手数 <b id="tbMoves">0</b></span>
  </div>
  <div id="boardWrap">
    <canvas id="board"></canvas>
    <div id="start">
      <h2>対戦開始</h2>
      <p>あなたの手番を選んでください<br><span class="note">後手にはハンデとして7.5ポイント加算されます</span></p>
      <div class="pick">
        <button class="btn" id="btnFirst">先手<small>黒の工場</small></button>
        <button class="btn" id="btnSecond">後手<small>白の工場</small></button>
      </div>
    </div>
    <div id="banner"><h2 id="bnTitle"></h2><p id="bnText"></p><div id="bnScore"></div>
      <div class="bnbtns"><button class="btn" id="btnBanner">もう一局</button><button class="btn" id="btnView">盤面を見る</button></div></div>
  </div>

  <aside id="panel">
    <div class="plate p-title">
      <h1>ファクトリ囲碁</h1>
      <div class="sub">FACTORY-GO</div>
    </div>

    <div class="factions">
      <div class="plate fac f1" id="fac1">
        <canvas id="emb1"></canvas>
        <div class="nm" id="nm1">黒の工場</div>
        <div class="own">稼働 <b id="cnt1">0</b><span id="big1"></span></div><span id="cap1" class="hidden">0</span>
      </div>
      <div class="plate fac f2" id="fac2">
        <canvas id="emb2"></canvas>
        <div class="nm" id="nm2">白の工場</div>
        <div class="own">稼働 <b id="cnt2">0</b><span id="big2"></span></div><span id="cap2" class="hidden">0</span>
      </div>
    </div>

    <div class="plate p-status">
      <div class="status"><span id="turnTxt">手番：黒の工場</span><span>手数 <b id="moveNo">0</b></span></div>
      <div class="hint" id="hint"></div>
    </div>

    <div class="plate opts p-ctrl">
      <div class="btns" id="playBtns" style="grid-column:1/3;margin-bottom:4px">
        <button class="btn" id="btnPass">パス</button>
        <button class="btn" id="btnNew">新規対局</button>
      </div>
      <span>盤の大きさ</span>
      <select id="selSize"><option value="9" selected>9 × 9</option><option value="13">13 × 13</option><option value="19">19 × 19</option></select>
      <span>CPUの強さ</span>
      <select id="selLv"><option value="1" selected>弱い（見習い）</option><option value="2">普通（職人）</option><option value="3">強い（親方）</option></select>
      <label class="chk"><input type="checkbox" id="chkSound" checked> 効果音（金属音・蒸気・爆発）</label>
    </div>

    <div class="plate p-log"><div id="log"></div></div>

    <div class="plate p-rules">
      <button class="btn" id="btnRules" style="width:100%">ルールを見る</button>
    </div>
  </aside>

  <div id="rulesModal" class="rm" aria-hidden="true" role="dialog" aria-label="ルール">
    <div class="rm-card">
      <button class="rm-close" id="rmClose" aria-label="閉じる">×</button>
      <div class="rm-head"><span class="rm-title">ルール</span><span class="rm-count" id="rmCount"></span></div>
      <div class="rm-stage" id="rmStage"><img id="rmImg" alt="" draggable="false"><div class="rm-shield" id="rmShield"></div></div>
      <div class="rm-parent" id="rmParent"></div>
      <div class="rm-text" id="rmText"></div>
      <div class="rm-nav">
        <button class="btn" id="rmPrev">◀ 前へ</button>
        <div class="rm-dots" id="rmDots"></div>
        <button class="btn" id="rmNext">次へ ▶</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const $ = s => document.querySelector(s);
const DEMO = new URLSearchParams(location.search).get('demo');      // ?demo=... : a self-playing clip for the rules slideshow (loaded in an iframe)
const DEMO_CFG = { explode: { crop: [2, 2, 6, 6] }, capture: { crop: [0, 0, 3, 3] }, big: { crop: [0, 0, 5, 2] }, ending: {}, free: {} };      // free = scripted capture mode (intro video): board-only layout like a clip, but nothing plays by itself; crop set via __game.setCrop
let FREE_CROP = null;
if (DEMO) document.body.classList.add('demo');
const cv = $('#board'), ctx = cv.getContext('2d');
const bgcv = $('#bg'), bg = bgcv.getContext('2d');

/* ------------------------------------------------------------------ palette */
const PAL = {
  1: { // iron works
    rimHi:'#8a8f99', rim:'#454a52', rimLo:'#15171b',
    plateHi:'#646a75', plate:'#30343b', plateLo:'#0f1114',
    accentHi:'#f2b27a', accent:'#c4733a', accentLo:'#6a3512',
    gearHi:'#f0a868', gear:'#b9672f', gearLo:'#4a2410',
    glow:'#ff7a1f', glowHi:'#ffd9a0', glowRGB:'255,122,31'
  },
  2: { // brass guild
    rimHi:'#fff2c0', rim:'#dcae45', rimLo:'#80581a',
    plateHi:'#fff7d8', plate:'#ecd07c', plateLo:'#ad8128',
    accentHi:'#8ff0e6', accent:'#2a9d97', accentLo:'#0f4a47',
    gearHi:'#8ff0e6', gear:'#25908b', gearLo:'#0c3c3a',
    glow:'#3fe0d4', glowHi:'#e0fffb', glowRGB:'63,224,212'
  }
};
// 大型工場 = the same factory in the same colours, but armoured: a heavy bolted flange, reinforcing ribs and braced vents.

/* -------------------------------------------------------------- layout vars */

function buildNbr(n) {
  const out = [];
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {

/* ------------------------------------------------------------- Go logic */
function group(b, i) {
  const c = b[i], st = [i], mark = new Set([i]), libs = new Set();
  for (let k = 0; k < st.length; k++) {
    for (const q of nbr[st[k]]) {
      if (q < 0) continue;
      if (b[q] === 0) libs.add(q);
      else if (b[q] === c && !mark.has(q)) { mark.add(q); st.push(q); }
    }
  }
  return { stones: st, libs };
}

// Standard Go legality: place -> remove captured enemy groups -> own group must have a liberty.
// (The "closed vents" delay is purely visual, so a capturing move is legal even at a suicide point.)
function tryMove(b, i, c) {
  if (b[i] !== 0) return { ok:false, reason:'occupied' };
  const nb = b.slice(); nb[i] = c;
  const e = 3 - c, done = new Set(), groups = [];
  for (const q of nbr[i]) {
    if (q < 0 || nb[q] !== e || done.has(q)) continue;
    const g = group(nb, q);
    g.stones.forEach(s => done.add(s));
    if (g.libs.size === 0) groups.push(g.stones);
  }
  const captured = [];
  for (const gs of groups) for (const s of gs) { nb[s] = 0; captured.push(s); }
  if (group(nb, i).libs.size === 0) return { ok:false, reason:'suicide' };
  if (seen.has(nb.join(''))) return { ok:false, reason:'ko' };
  return { ok:true, nb, captured };
}

function areaScore(b, deadSet) {
  const eb = b.slice(); deadSet.forEach(i => eb[i] = 0);
  const sc = {1:0, 2:0}, owner = new Int8Array(N*N), vis = new Uint8Array(N*N);
  for (let i = 0; i < N*N; i++) {
    if (eb[i]) { sc[eb[i]]++; owner[i] = eb[i]; continue; }
    if (vis[i]) continue;
    const reg = [i], touch = new Set(); vis[i] = 1;
    for (let k = 0; k < reg.length; k++) for (const q of nbr[reg[k]]) {
      if (q < 0) continue;
      if (eb[q] === 0) { if (!vis[q]) { vis[q] = 1; reg.push(q); } } else touch.add(eb[q]);
    }
    if (touch.size === 1) { const c = [...touch][0]; sc[c] += reg.length; reg.forEach(s => owner[s] = c); }
  }
  return { b: sc[1], w: sc[2], owner, eb };
}

function computeLibs() {
  libsOf = new Int16Array(N*N);
  const done = new Uint8Array(N*N);
  for (let i = 0; i < N*N; i++) {
    if (!board[i] || done[i]) continue;
    const g = group(board, i);
    g.stones.forEach(s => { done[s] = 1; libsOf[s] = g.libs.size; });
  }
  computeEyes();
}

/* ---- eyes: an empty region wholly enclosed by ONE chain of ours, whose empty points are all that chain's liberties

function computeEyes() {

  const eyes = chains.map(() => []);
  for (const c of [1, 2]) {

    for (let i = 0; i < N * N; i++) {
      if (board[i] === c || vis[i]) continue;

      }
      // only a single point walled in on all four sides by our own chain / the board edge counts as an eye (a chimney site)
      if (reg.length === 1 && empties.length === 1 && border.size === 1) eyes[[...border][0]].push(empties);

        for (const p of empt) for (const q of nbr[p]) if (q >= 0 && board[q] === c && cid[q] === ch) chimLvl[q * 4 + nbr[q].indexOf(p)] = 1;
        continue;

      const pc = empt.reduce((a, b) => Math.hypot(a % N - mx, ((a / N) | 0) - my) <= Math.hypot(b % N - mx, ((b / N) | 0) - my) ? a : b);

      for (const q of nbr[pc]) if (q >= 0 && board[q] === c && cid[q] === ch) { chimLvl[q * 4 + nbr[q].indexOf(pc)] = first ? 3 : 2; first = false; }
    }
    if (e >= 2) { stones.forEach(s => big.add(s)); bigChains[c]++; }

        if (st.some(x => prevBig.has(x))) continue;          // an existing 大型工場 that merely grew: no new fanfare
        st.forEach((x, j) => bigAt[x] = t0 + j * 55);          // the gold plating spreads along the chain
        bigEvents.push({ stones: st, color: board[s], t0, sounded: false });
        lockUntil = Math.max(lockUntil, t0 + st.length * 55 + 1900);       // nobody moves until the completion animation has played out

function playMove(i) {

  board = r.nb;
  meta[i] = newMeta(now);

    const arr = r.captured.slice().sort((a, b) => dist(a, i) - dist(b, i));
    arr.forEach((s, k) => {
      dying.push({ idx:s, color:3-c, m:meta[s], explodeAt: now + CAP_FIRST_MS + k * CAP_STEP_MS });

    caps[c] += arr.length;

  } else {

const dist = (a, b) => Math.abs((a%N) - (b%N)) + Math.abs(((a/N)|0) - ((b/N)|0));

let passFx = null;                          // { t0, who }: the "パス" call-out shown over the board

  passFx = closing ? { t0: performance.now(), who: turn, text: '終局！', pre: '両者パスにより', dur: 2000 } : { t0: performance.now(), who: turn };
  if (closing) sfxEndCall(); else sfxPass();

    const d = new Map(), fr = [];                         // grow outward-in from our own stones
    for (const i of terr) if (nbr[i].some(q => q >= 0 && board[q] === c)) { d.set(i, 0); fr.push(i); }
    for (let k = 0; k < fr.length; k++) for (const q of nbr[fr[k]]) if (q >= 0 && terr.has(q) && !d.has(q)) { d.set(q, d.get(fr[k]) + 1); fr.push(q); }

        E.pending.delete(i);

        computeLibs(); if (n === 0) sfxTick(E.idx / E.queue.length); burstDust(px(i), py(i), c, true); updateUI();
        E.nextAt += E.interval; if (E.nextAt < now - 80) E.nextAt = now;
      }

  } else if (E.step === 'pause') {
    if (now >= E.nextAt) { E.step = 'drum'; E.t0 = now; sfxDrum(E.dur); updateUI(); }
  } else if (E.step === 'drum') {

  for (const c of endStacks.values()) n[c]++;

    `<div class="side ${win === 2 ? 'win' : ''}"><small>白の工場</small><b>${w}</b><em>（${n[2]} + 後手ハンデ ${KOMI}）</em></div>`;
  finish(`${FAC[win].name}の勝利！`, `${diff} ポイント差`);

/* ------------------------------------------------------------- CPU (simple) */
let cpuLevel = 1;   // 1 = apprentice, 2 = craftsman, 3 = master
function cpuMove() {
  const c = turn, e = 3 - c, lv = cpuLevel;
  const cand = [];
  for (let i = 0; i < N*N; i++) {
    if (board[i]) continue;
    const r = tryMove(board, i, c);
    if (!r.ok) continue;
    const nbs = nbr[i].filter(q => q >= 0);
    let s = (lv === 1 ? rnd(0, 7) : lv === 2 ? rnd(0, 1.6) : rnd(0, .6)) + r.captured.length * (lv === 1 ? 6 : 10);
    const og = group(r.nb, i), libs = og.libs.size;
    if (nbs.every(q => board[q] === c) && !r.captured.length) s -= 28;
    if (libs === 1 && !r.captured.length) s -= 12 + og.stones.length * 3;
    else s += Math.min(libs, 4) * .6;
    const ms = new Set(); let resc = false;
    for (const q of nbs) {
      if (r.nb[q] === e && !ms.has(q)) {
        const g = group(r.nb, q); g.stones.forEach(x => ms.add(x));
        const f = lv === 1 ? .4 : 1;
        s += f * (g.libs.size === 1 ? 5 + g.stones.length * 1.5 : g.libs.size === 2 ? (lv === 3 ? 2.6 : 1.6) : 0);
      }
      if (board[q] === c && !ms.has(q)) {
        const g0 = group(board, q); g0.stones.forEach(x => ms.add(x));
        if (g0.libs.size === 1 && libs > 1) { s += (lv === 1 ? .3 : 1) * (6 + g0.stones.length * 3); resc = true; }
      }
    }
    const x = i % N, y = (i / N) | 0, line = Math.min(x, y, N-1-x, N-1-y);
    s += [-4, -1, 1.6, 2.2, 1][Math.min(line, 4)];
    let near = false;
    for (let dy = -2; dy <= 2 && !near; dy++) for (let dx = -2; dx <= 2; dx++) {
      const xx = x + dx, yy = y + dy;
      if (xx >= 0 && yy >= 0 && xx < N && yy < N && board[yy*N+xx]) { near = true; break; }
    }
    s += near ? 1.2 : (moveNo < 8 ? 0 : -1.5);
    cand.push({ i, s, cap: r.captured.length, resc, libs });
  }
  if (passes === 1) {                         // the player has just passed: only worthwhile moves, otherwise pass too (even when behind)
    const m = moveAfterPlayerPass(cand, c, lv);
    if (m < 0) doPass(); else playMove(m);
    return;
  }
  {                                           // invasion check, applied to every move: no walking into an opponent's territory that cannot live
    const { regions, terrOf } = territoriesOf(e, lv);
    for (let k = cand.length - 1; k >= 0; k--) {
      const cd = cand[k], ri = terrOf[cd.i];
      if (ri < 0 || cd.cap > 0 || cd.resc) continue;          // outside opponent territory, or a capture / rescue: fine
      const reg = regions[ri];
      if (!reg.ok || cd.libs < 2 || failBlocked(cd.i)) { cand.splice(k, 1); continue; }
      const px0 = cd.i % N, py0 = (cd.i / N) | 0;
      if (px0 === 0 || py0 === 0 || px0 === N - 1 || py0 === N - 1) cd.s -= 4;      // first line: too few liberties
    }
  }
  cand.sort((a, b) => b.s - a.s);
  if (lv === 3) {          // master: look one reply ahead and avoid moves that let the opponent blow up our factories
    for (const cd of cand.slice(0, 8)) {
      const r = tryMove(board, cd.i, c); let worst = 0;
      for (let p = 0; p < N*N; p++) {
        if (r.nb[p] !== 0 || !nbr[p].some(q => q >= 0 && r.nb[q] === c)) continue;
        const rr2 = tryMove(r.nb, p, e);
        if (rr2.ok && rr2.captured.length > worst) worst = rr2.captured.length;
      }
      cd.s -= worst * 9;
    }

  if (lv === 1 && cand.length > 3 && Math.random() < .12) cand[0] = cand[1 + ((Math.random() * Math.min(8, cand.length - 1)) | 0)];   // apprentice slips up
  const best = cand.length ? cand[0].s : -1e9, bi = cand.length ? cand[0].i : -1;

/* After the player passes the CPU plays on only if it has a worthwhile move:
   (1) capture an enemy group, (2) rescue one of its own groups in atari, (3) invade an enemy territory it could plausibly live in.
   Otherwise it passes, whatever the score. A territory is judged by its AREA and its WIDTH (largest empty k x k square inside it):
   a 1-wide corridor can never hold two eyes, however long it is. Stronger CPUs accept tighter spaces. */
function invadable(reg, lv) {
  if (reg.sq < 2) return false;                              // corridors: never
  if (reg.big) return false;                                 // walled by 大型工場 only: nothing to attack
  let need = reg.sq >= 3 ? [9, 8, 7][lv - 1] : [99, 8, 6][lv - 1];     // width >= 3 : roomy; width 2 : apprentice never tries

  return reg.area >= Math.max(5, need);

/* Opponent territory (always analysed, whether or not the player has passed): a connected empty region that is hemmed in by at least

function drawVent(g, k, v, P, r, t, seed, danger, fade = 1) {

  g.globalAlpha = Math.min(1, v * 1.4) * fl * fade;

    g.fillStyle = P.rimHi; g.fillRect(-W/2, -H/2, W, 1); g.fillRect(-W/2, H/2 - 1, W, 1);

}

function drawStone(g, x, y, color, m, now, o = {}) {

/* ---- territory haze: each side's exhaust drifts over the empty points around its open vents and thins out with distance.
   Thick haze = a tight, enclosed space; thin haze = wide open ground that an invader could still use. ---- */
let hazeCur = { 1: new Float32Array(0), 2: new Float32Array(0) }, hazeD = null, hazeV = { 1: new Float32Array(0), 2: new Float32Array(0) }, hazeK = { 1: new Float32Array(0), 2: new Float32Array(0) }, chainSz = new Int16Array(0);

    hazeCur = { 1: new Float32Array(n), 2: new Float32Array(n) }; hazeV = { 1: new Float32Array(n), 2: new Float32Array(n) }; hazeK = { 1: new Float32Array(n), 2: new Float32Array(n) };
    chainSz = new Int16Array(n);

  // farther it carries. A lone factory barely clouds its own neighbours. Where both sides' haze meets, the stronger one wins and the
  // weaker is cancelled, so what remains reads as each side's ground.
  chainSz.fill(0);

    if (!board[i] || chainSz[i]) continue;
    const st = [i]; chainSz[i] = -1;
    for (let k = 0; k < st.length; k++) for (const q of nbr[st[k]]) if (q >= 0 && board[q] === board[i] && !chainSz[q]) { chainSz[q] = -1; st.push(q); }
    st.forEach(s => chainSz[s] = st.length);
  }
  for (const c of [1, 2]) {
    const val = hazeV[c], dec = hazeK[c], q = []; val.fill(0);
    for (let i = 0; i < n; i++) {
      if (board[i] !== c || !meta[i] || now < meta[i].openAt) continue;                  // only stones whose vents are open exhale
      const sz = chainSz[i], v0 = Math.min(.7, .08 + .12 * (sz - 1)), k0 = .48 + .03 * Math.min(sz - 1, 6);   // 1 stone: faint, short; 7+ linked: strong, long

    }

      const p = q[k], nv = val[p] * dec[p]; if (nv < .03) continue;

}
function drawHaze(g, now) {
  if (hazeCur[1].length !== N * N) return;
  for (const c of [1, 2]) {
    const cur = hazeCur[c], spr = puff[c === 1 ? 'blk' : 'wht'], amp = c === 1 ? .66 : .62;
    for (let p = 0; p < N * N; p++) {
      const v = cur[p]; if (v < .035 || board[p]) continue;
      const x = px(p), y = py(p), ph = p * 1.37 + c * 2.1;
      for (let k = 0; k < 2; k++) {
        g.globalAlpha = v * amp * (k ? .7 : 1) * (.8 + .2 * Math.sin(now * .0009 + ph * (k + 1)));
        const s = cs * (1.5 + .25 * Math.sin(now * .0006 + ph + k * 2)), ox = Math.sin(now * .00045 + ph + k * 3) * cs * .14, oy = Math.cos(now * .0004 + ph * 1.3 + k) * cs * .14;
        g.drawImage(spr, x + ox - s / 2, y + oy - s / 2, s, s);

function update(now, dt) {
  // dying stones -> explosions
  dyingMap.clear();
  for (let k = dying.length - 1; k >= 0; k--) {
    const d = dying[k];
    if (now >= d.explodeAt) { explode(d, now); dying.splice(k, 1); } else dyingMap.set(d.idx, d);
  }
  // vents
  const open = [], smokers = [], chims = [];
  for (let i = 0; i < N * N; i++) {
    const m = meta[i]; if (!m) continue;
    const ready = now >= m.openAt, prog = clamp((now - m.placedAt) / (m.openAt - m.placedAt), 0, 1);
    if (ready && !m.opened) { m.opened = true; if (now - m.openAt < 400) sfxHiss(); }
    m.ang += m.spin * dt * (ready ? 1 : .15 + .85 * prog * prog);
    const c = board[i];
    if (!m.dng) m.dng = [false, false, false, false];
    for (let k = 0; k < 4; k++) {
      const q = nbr[i][k], tgt = ready && q >= 0 && board[q] === 0 && !dyingMap.has(q);
      if (tgt && !m.tgt[k] && m.opened) ventBurst(px(i), py(i), k, c);
      m.tgt[k] = tgt;
      m.dng[k] = tgt && libsOf[i] === 1 && now >= lockUntil && phase === 'play';   // last remaining vent
      m.vent[k] = clamp(m.vent[k] + (tgt ? 4.5 : -7) * dt, 0, 1);
      if (m.vent[k] > .9) open.push(i * 4 + k);
    }
    if (ready) CHIM[m.variant].forEach(p => smokers.push([i, p]));
    {                                                 // gold plating for 大型工場 (kept through the automatic ending)
      const wantLux = (eyeCnt[i] >= 2 || endBig.has(i)) && now >= (bigAt[i] || 0) ? 1 : 0;
      if (m.lux === undefined) m.lux = 0;
      if (wantLux && !m.luxStart && m.lux < 1) m.luxStart = now; else if (!wantLux) m.luxStart = 0;
      m.lux = clamp(m.lux + (wantLux ? 1 : -1) * dt * 4, 0, 1);
    }
    for (let k = 0; k < 4; k++) {                     // eye chimneys grow once the vent is open; the large ones wait for the upgrade moment
      const lv = m.tgt[k] ? chimLvl[i * 4 + k] : 0;
      if (!m.own) m.own = [false, false, false, false];
      m.own[k] = lv === 3;
      let want = lv >= 2 ? 2 : lv;
      if (lv >= 2 && bigAt[i] && now < bigAt[i]) want = 1;
      else if (lv === 0 && m.chim[k] > 1) want = 0;
      const step = dt * (want > m.chim[k] && want === 2 ? 1.6 : 2.2);
      m.chim[k] = clamp(m.chim[k] + clamp(want - m.chim[k], -step, step), 0, 2);
      if (m.chim[k] > .95) chims.push(i * 4 + k);
    }
  }
  for (const ev of bigEvents) if (!ev.sounded && now >= ev.t0) {       // 大型工場 upgrade moment
    ev.sounded = true; sfxUpgrade();
    logMsg(`${FAC[ev.color].name}の工場群が大型工場にアップグレード！（二眼完成）`, true);
  }
  bigEvents = bigEvents.filter(ev => now < ev.t0 + ev.stones.length * 55 + 1900);
  {
    const sc0 = sc(), cScale = Math.min(1, 120 / Math.max(1, chims.length));
    for (const code of chims) {
      const i = code >> 2, k = code & 3, d = [[1,0],[0,1],[-1,0],[0,-1]][k], big = meta[i].chim[k] > 1.5, sx = R * (.95 + (big ? EYE_CX : .5));
      if (big && !meta[i].own[k]) continue;             // the large stack is shared: only its owner vent emits
      if (Math.random() > (big ? 2.4 : .8) * dt * cScale) continue;
      addP({ t:'p', spr:smokeSpr(board[i]), x:px(i) + d[0] * sx, y:py(i) + d[1] * sx, vx:rnd(4,14) * sc0, vy:rnd(-30,-16) * sc0,
        s0: big ? cs * .34 : cs * .2, grow: big ? cs * .9 : cs * .45, life: rnd(1.6, 2.6), age:0, a: big ? .6 : .4 });
    }
  }
  const s = sc();
  const scale = Math.min(1, 200 / Math.max(1, open.length));
  for (const code of open) {
    const i = code >> 2, k = code & 3, d = [[1,0],[0,1],[-1,0],[0,-1]][k], danger = meta[i].dng[k];
    if (meta[i].chim[k] > .5) continue;               // a chimney carries this vent's smoke instead
    if (Math.random() > (danger ? 4.5 : 1.1 * scale) * dt) continue;
    const sp = rnd(26, 52) * s * (danger ? 2 : 1), pr = rnd(-.3, .3);
    addP({ t:'p', spr: smokeSpr(board[i]), x:px(i)+d[0]*R*1.1, y:py(i)+d[1]*R*1.1,
      vx:(d[0]-d[1]*pr)*sp, vy:(d[1]+d[0]*pr)*sp, s0: danger ? cs*.4 : cs*.22, grow: danger ? cs*1.2 : cs*.55,
      life: danger ? rnd(1,1.6) : rnd(.8,1.4), age:0, a: danger ? .8 : .5 });
  }

    addP({ t:'p', spr:smokeSpr(board[i]), x:px(i)+p[0]*R, y:py(i)+p[1]*R, vx:rnd(6,16)*s, vy:rnd(-24,-12)*s, s0:cs*.2, grow:cs*.45, life:rnd(1.5,2.4), age:0, a:.34 });
  }

const embMeta = { 1:{variant:0, ang:0, spin:1.2, vent:[0,0,0,0], openAt:0, placedAt:null, seed:.3}, 2:{variant:2, ang:0, spin:-1.2, vent:[0,0,0,0], openAt:0, placedAt:null, seed:.7} };

function render(now, dt) {

  g.clearRect(0, 0, S, S);
  g.save();
  if (shake) g.translate(rnd(-shake, shake) * .5, rnd(-shake, shake) * .5);
  g.drawImage(boardCv, 0, 0, S, S);
  // scorch decals
  for (const d of decals) {
    const age = (now - d.t0) / 1000, a = clamp(.95 - age / 40, .22, .95);
    g.save(); g.globalAlpha = a; g.translate(d.x, d.y); g.rotate(d.rot); g.drawImage(puff.scorch, -cs * .8, -cs * .8, cs * 1.6, cs * 1.6); g.restore();

      if (lx > .02) { g.globalAlpha *= lx; g.drawImage(coupSprX[c], -w / 2, -h / 2, w, h); }

  modal.addEventListener('click', e => { if (e.target === modal) close(); });
  document.addEventListener('keydown', e => {
    if (!modal.classList.contains('open')) return;
    if (e.key === 'Escape') close(); else if (e.key === 'ArrowRight') next(); else if (e.key === 'ArrowLeft') prev();
  });
  let sx = null;                                                                           // swipe left / right on the picture
  $('#rmStage').addEventListener('pointerdown', e => { sx = e.clientX; });
  $('#rmStage').addEventListener('pointerup', e => { if (sx === null) return; const dx = e.clientX - sx; sx = null; if (Math.abs(dx) > 40) (dx < 0 ? next : prev)(); });
  $('#rmStage').addEventListener('pointercancel', () => { sx = null; });
}

/* ------------------------------------------------------------- main loop */
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now;
  if (!document.hidden) {
    tickEnding(now);
    update(now, dt);
    render(now, dt);
    drawBG(now);
    drawEmblems(now, dt);
    const h = hintHTML(now); if (h !== lastHint) { $('#hint').innerHTML = h; lastHint = h; }
    if (phase === 'play' && isCpuTurn() && now >= lockUntil && !cpuTimer) {
      cpuTimer = setTimeout(() => { cpuTimer = 0; if (phase === 'play' && isCpuTurn()) { cpuMove(); } }, 520);
    }
    if (lockUntil && now >= lockUntil) { lockUntil = 0; if (phase === 'play') { updateUI(); } }
  }
  requestAnimationFrame(frame);
}

newGame();
requestAnimationFrame(frame);

/* ---- rules-slideshow clips: the real engine plays a short scene on a loop (muted), inside an iframe ---- */
if (DEMO && DEMO !== 'free') {
  $('#chkSound').checked = false;
  const sleep = ms => new Promise(r => setTimeout(r, ms)), P = (x, y) => playMove(y * 9 + x);
  const seqPlay = async (seq, gap) => { for (const [x, y] of seq) { P(x, y); await sleep(gap); } };
  (async () => {
    for (;;) {
      N = 9; vs = '2p'; newGame(); startAs(1);
      if (DEMO === 'explode') {                       // white's last vent is plugged -> boom
        await sleep(600);
        await seqPlay([[3, 4], [4, 4], [5, 4], [8, 8], [4, 3], [8, 0]], 260);
        await sleep(1800); P(4, 5); await sleep(4200);
      } else if (DEMO === 'capture') {                // a "suicide" point that blows up the opponent first: ghost + warning rings, then the build
        await sleep(600);
        await seqPlay([[2, 0], [1, 0], [1, 1], [0, 1], [0, 2], [8, 8]], 260);
        await sleep(1800); hover = -1; setHover(0); await sleep(1800); P(0, 0); await sleep(4200);
      } else if (DEMO === 'big') {                    // the second eye is closed -> 大型工場
        await sleep(600);
        await seqPlay([[0, 0], [8, 8], [0, 1], [8, 6], [1, 1], [8, 4], [2, 1], [6, 8], [2, 0], [6, 6], [3, 1], [6, 4], [4, 1], [4, 8]], 150);
        await sleep(2200); P(4, 0); await sleep(5400);
      } else if (DEMO === 'ending') {                 // two passes -> 終局！ -> auto-build -> drum roll -> result
        await sleep(600);
        const walls = []; for (let y = 0; y < 9; y++) walls.push([3, y], [5, y]);
        await seqPlay(walls, 70);
        await sleep(2200); doPass(); await sleep(1500); doPass();
        for (let k = 0; k < 400 && phase !== 'over'; k++) await sleep(100);
        await sleep(4200);
      } else { await sleep(1000); }
    }
  })();
}

  adv(ms) { const base = performance.now(); for (let t = 0; t <= ms; t += 33) { tickEnding(base + t); update(base + t, .033); } render(base + ms, .033); },
  hoverAt(i) { hover = -1; setHover(i); }, get cs() { return cs; }, get M() { return M; }, get S() { return S; }, get dpr() { return dpr; }, failPush(i) { invFail.push({ i, at: moveNo }); }, failBlocked, get haze() { return hazeCur; }, updateHaze, setLv(v) { cpuLevel = v; }, get chimLvl() { return chimLvl; }, get eyeCnt() { return eyeCnt; }, get meta() { return meta; }, startAs, startEnding, tickEnding, reveal, get ending() { return ending; }, cpuMove, get cpuTimer() { return cpuTimer; }, get lock() { return lockUntil; }, get phase() { return phase; }, get board() { return board; }, playMove, doPass, tryMove, get turn() { return turn; }, set vs(v) { vs = v; }, get N() { return N; }, get caps() { return caps; }, setN(n){ N = n; newGame(); } };
